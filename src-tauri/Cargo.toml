[package]
name = "svn-scope"
version = "0.1.3"
description = "A focused local changes viewer for Subversion working copies"
authors = ["SVN Scope contributors"]
edition = "2021"

[lib]
name = "svn_scope_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
encoding_rs = "0.8.35"
quick-xml = { version = "0.42.0", features = ["serialize"] }
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.11.5", features = [] }
tauri-plugin-dialog = "2.7.2"

[dev-dependencies]
tempfile = "3.27.0"
